<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HVC Helton - Grafico ao vivo</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body { background:#0d121b; margin:0; font-family: sans-serif; }
  #chart { width:100%; height:100vh; }
</style>
</head>
<body>
<select id="seletorAtivo" style="position:absolute; z-index:10; margin:10px; padding:8px; background:#0d121b; color:#fff; border:1px solid #1c2430;">
  <option value="EURUSD">EUR/USD (normal)</option>
  <option value="EURUSD-OTC" selected>EUR/USD (OTC)</option>
  <option value="EURJPY">EUR/JPY (normal)</option>
  <option value="EURJPY-OTC">EUR/JPY (OTC)</option>
  <option value="ETHUSD">Ethereum (normal)</option>
  <option value="ETHUSD-OTC">Ethereum (OTC)</option>
  <option value="BTCUSD">Bitcoin (normal)</option>
  <option value="BTCUSD-OTC">Bitcoin (OTC)</option>
</select>
<div id="chart"></div>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout: { background: { color: '#0d121b' }, textColor: '#ccc' },
  grid: { vertLines: {color:'#1c2430'}, horzLines:{color:'#1c2430'} },
  width: window.innerWidth,
  height: window.innerHeight,
});
const candleSeries = chart.addCandlestickSeries();

let ativoAtual = document.getElementById('seletorAtivo').value;

async function atualizar() {
  const resp = await fetch('/candles?ativo=' + ativoAtual);
  const dados = await resp.json();
  candleSeries.setData(dados);
}

document.getElementById('seletorAtivo').addEventListener('change', function() {
  ativoAtual = this.value;
  atualizar();
});

atualizar();
setInterval(atualizar, 5000);
</script>
</body>
</html>
